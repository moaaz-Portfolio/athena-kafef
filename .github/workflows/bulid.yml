name: Build & publish installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: wifi-radar-pages-v2
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build firmware for ESP32-S3 with Espressif CI
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: esp32s3
          path: .
          command: idf.py set-target esp32s3 && idf.py build && idf.py merge-bin -o merged.bin && test -s build/merged.bin && test -s build/esp32s3-wifi-radar.bin

      - name: Collect firmware files
        shell: bash
        run: |
          mkdir -p docs/firmware
          cp build/merged.bin docs/firmware/radar-s3-merged.bin
          cp build/esp32s3-wifi-radar.bin docs/firmware/esp32s3-wifi-radar.bin
          ls -lh docs/firmware

      - name: Keep firmware files as artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: docs/firmware/*.bin

      - name: Prepare Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
