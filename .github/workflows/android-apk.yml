name: Build WiFi Radar Android APK

on:
  push:
    branches:
      - main
      - "wifi-radar/**"
    paths:
      - "android-notifier/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android-notifier/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android-notifier
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wifi-radar-android-debug
          path: android-notifier/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
